<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Продукты для рецептов</title><style>body{font:16px system-ui;margin:auto;max-width:1100px;padding:20px;background:#f6f7f3;color:#202920}h1{margin-bottom:4px}.note{color:#625d47;background:#fff5d9;padding:12px;border-radius:8px}select,input{font:inherit;padding:9px;border:1px solid #bbb;border-radius:6px;max-width:100%}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}label{display:grid;gap:5px}#ingredients{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:8px 12px;border:1px solid #9bac9b;border-radius:8px;background:white;cursor:pointer}button.active{background:#285b3c;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:white;border:1px solid #d8ded7;border-radius:10px;padding:15px;overflow-wrap:anywhere}.card h3{margin:8px 0}.small{color:#59665a;font-size:.9em}a{color:#235f40}p{line-height:1.45}</style></head><body><h1>Продукты для рецептов</h1><p>Выберите рецепт или ингредиент и посмотрите собранные товары трёх магазинов.</p><p class="note">Данные получены из поискового индекса: цены и наличие могут быть неактуальны, полнота ассортимента не подтверждена. Состав и соответствие рецепту проверяйте по ссылке на товар.</p><div class="controls"><label>Рецепт <select id="recipe"><option value="">Все ингредиенты</option></select></label><label>Магазин <select id="store"><option value="">Все магазины</option><option value="perekrestok">Перекрёсток</option><option value="pyaterochka">Пятёрочка</option><option value="magnit">Магнит</option></select></label><label>Поиск товара <input id="search" type="search" placeholder="Название"></label></div><div id="ingredients"></div><h2 id="heading">Выберите ингредиент</h2><p id="status" role="status"></p><div id="products" class="grid"></div><script>
const $=id=>document.getElementById(id);let ingredients=[],recipes=[],selected=null,seq=0;const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function all(path){let out=[],offset=0;do{const r=await fetch(path+(path.includes('?')?'&':'?')+'limit=250&offset='+offset);if(!r.ok)throw Error('Ошибка загрузки');const d=await r.json();out.push(...d.results);offset=d.next_offset}while(offset!==null);return out}function showIngredients(){const recipe=recipes.find(r=>String(r.id)===$('recipe').value);const available=recipe?recipe.ingredients:ingredients.map(i=>({ingredient_id:i.ingredient_id,name:i.name,purchase_required:i.purchase_required}));$('ingredients').innerHTML=available.map(i=>`<button data-id="${Number(i.ingredient_id)}" class="${selected===i.ingredient_id?'active':''}">${safe(i.name)}</button>`).join('');$('ingredients').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.id);showIngredients();load()});if(selected&&!available.some(i=>i.ingredient_id===selected)){selected=null;$('products').innerHTML='';$('heading').textContent='Выберите ингредиент';$('status').textContent=''}}async function load(){if(!selected)return;const current=++seq;const ingredient=ingredients.find(i=>i.ingredient_id===selected);$('heading').textContent=ingredient.name;$('status').textContent='Загрузка…';try{let params=new URLSearchParams();if($('store').value)params.set('store',$('store').value);if($('search').value.trim())params.set('q',$('search').value.trim());const rows=await all('/v1/ingredients/'+selected+'/products?'+params);if(current!==seq)return;$('status').textContent=ingredient.purchase_required?`Найдено товаров: ${rows.length}`:'Вода — покупать не нужно.';$('products').innerHTML=rows.map(p=>{let n=p.nutrition||{},fmt=v=>v==null?'нет данных':safe(v),basis=n.basis_unit?`на ${safe(n.basis_quantity)} ${safe(n.basis_unit)}`:'база не указана';let price=p.price_rub==null?'Цена неизвестна':safe(p.price_rub)+' ₽'+(p.price_unit==='kg'?' / кг':'');return `<article class="card"><div class="small">${safe(p.store_name)}</div><h3>${safe(p.product_name)}</h3><strong>${price}</strong><p><b>Состав:</b> ${safe(p.ingredients_text)||'нет данных'}</p><p><b>КБЖУ</b> (${basis}): ${fmt(n.energy_kcal)} ккал; Б ${fmt(n.protein_g)} г; Ж ${fmt(n.fat_g)} г; У ${fmt(n.carbohydrate_g)} г${p.nutrition_usable?'':' <span class="small">(данные неполные или не подтверждены)</span>'}</p><a href="${safe(p.source_url)}" target="_blank" rel="noopener noreferrer">Карточка магазина ↗</a></article>`}).join('')}catch(e){if(current===seq)$('status').textContent='Не удалось загрузить товары.'}}$('recipe').onchange=showIngredients;$('store').onchange=load;$('search').oninput=load;Promise.all([all('/v1/ingredients'),all('/v1/recipes')]).then(([i,r])=>{ingredients=i;recipes=r;for(const recipe of r){const o=document.createElement('option');o.value=recipe.id;o.textContent=recipe.title;$('recipe').append(o)}showIngredients()}).catch(()=>$('status').textContent='Не удалось загрузить каталог.');
</script></body></html>
