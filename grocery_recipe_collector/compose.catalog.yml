services:
  catalog:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:18082:8080"
    volumes:
      - ./data/ladno_2026-10-27/catalog.json.gz:/data/catalog.json.gz:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
